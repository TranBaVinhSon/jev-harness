<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1030" viewBox="0 0 940 1030" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Where Jev plugs into an agent loop</title>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B2B33"/>
    </marker>
    <marker id="jev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D4AFF"/>
    </marker>
    <marker id="plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A08BFF"/>
    </marker>
  </defs>

  <rect width="940" height="1030" fill="#FFFFFF"/>

  <!-- Title and legend -->
  <text x="40" y="38" font-size="20" font-weight="600" fill="#1C1C22">Where Jev plugs into an agent loop</text>
  <text x="40" y="60" font-size="12.5" fill="#6B6B76">Jev advises at each step; the agent still makes every decision</text>
  <rect x="640" y="22" width="14" height="14" rx="3" fill="#F1EDFF" stroke="#6D4AFF"/>
  <text x="662" y="34" font-size="12.5" fill="#55555F">Built and benchmarked</text>
  <rect x="640" y="44" width="14" height="14" rx="3" fill="#FBFAFF" stroke="#A08BFF" stroke-dasharray="3 2"/>
  <text x="662" y="56" font-size="12.5" fill="#55555F">On the roadmap</text>

  <!-- Session start -->
  <rect x="80" y="82" width="300" height="52" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="113" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">Session start</text>
  <text x="400" y="104" font-size="12.5" fill="#6B6B76">starting model set by config, never chosen from</text>
  <text x="400" y="121" font-size="12.5" fill="#6B6B76">the prompt; a stronger model only by escalation</text>

  <!-- Agent loop container -->
  <rect x="40" y="166" width="860" height="752" rx="16" fill="#F6F6F8" stroke="#D5D5DD" stroke-width="1.5"/>
  <text x="252" y="190" font-size="13" font-weight="600" fill="#55555F">Agent loop · the agent reasons and chooses every tool call</text>
  <line x1="230" y1="134" x2="230" y2="214" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- Decide -->
  <rect x="80" y="216" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="243" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">Agent decides on a tool call</text>
  <line x1="230" y1="260" x2="230" y2="274" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- Kinds of call -->
  <rect x="80" y="276" width="300" height="202" rx="10" fill="#FFFFFF" stroke="#C4C4CC" stroke-dasharray="4 4"/>
  <text x="96" y="296" font-size="11.5" fill="#6B6B76">the call is one of</text>
  <rect x="100" y="304" width="260" height="34" rx="17" fill="#FFFFFF" stroke="#9A9AA6"/>
  <text x="230" y="326" font-size="13.5" fill="#1C1C22" text-anchor="middle">tool search</text>
  <rect x="100" y="346" width="260" height="34" rx="17" fill="#FFFFFF" stroke="#9A9AA6"/>
  <text x="230" y="368" font-size="13.5" fill="#1C1C22" text-anchor="middle">skill</text>
  <rect x="100" y="388" width="260" height="34" rx="17" fill="#FFFFFF" stroke="#9A9AA6"/>
  <text x="230" y="410" font-size="13.5" fill="#1C1C22" text-anchor="middle">shell command</text>
  <rect x="100" y="430" width="260" height="34" rx="17" fill="#FFFFFF" stroke="#C4C4CC" stroke-dasharray="3 3"/>
  <text x="230" y="452" font-size="13.5" fill="#8A8A94" text-anchor="middle">any other tool</text>
  <line x1="230" y1="478" x2="230" y2="496" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- Tool runs -->
  <rect x="80" y="498" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="525" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">Tool runs</text>
  <line x1="230" y1="542" x2="230" y2="560" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- Tool result -->
  <rect x="80" y="562" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="589" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">Tool result</text>
  <line x1="230" y1="606" x2="230" y2="634" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- After each tool batch -->
  <rect x="80" y="636" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="663" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">After each tool batch</text>
  <line x1="230" y1="680" x2="230" y2="758" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- Reads results -->
  <rect x="80" y="760" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="784" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">Agent reads the results,</text>
  <text x="230" y="804" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">then loops or wants to stop</text>
  <line x1="230" y1="816" x2="230" y2="840" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- Wants to stop -->
  <rect x="80" y="842" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="869" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">Agent wants to stop</text>

  <!-- Loop back, from reading results and from a blocked stop -->
  <path d="M80,864 H60 V238 H78" fill="none" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>
  <line x1="80" y1="788" x2="60" y2="788" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="52" y="520" font-size="12" fill="#55555F" text-anchor="middle" transform="rotate(-90 52 520)">keep working</text>

  <!-- Answer exit -->
  <line x1="230" y1="886" x2="230" y2="954" stroke="#2B2B33" stroke-width="1.5" marker-end="url(#flow)"/>
  <rect x="80" y="956" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#2B2B33" stroke-width="1.5"/>
  <text x="230" y="983" font-size="15" font-weight="600" fill="#1C1C22" text-anchor="middle">Final answer</text>

  <!-- Built Jev hooks -->
  <g font-size="13.5" fill="#2A2140">
    <rect x="500" y="304" width="380" height="34" rx="8" fill="#F1EDFF" stroke="#6D4AFF"/>
    <text x="516" y="326">Jev adds its top-ranked tools to the agent's pick</text>
    <line x1="500" y1="321" x2="362" y2="321" stroke="#6D4AFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#jev)"/>

    <rect x="500" y="552" width="380" height="54" rx="8" fill="#F1EDFF" stroke="#6D4AFF"/>
    <text x="516" y="575">Jev keeps the relevant chunks; the rest</text>
    <text x="516" y="595">stays readable through read_spill</text>
    <line x1="500" y1="584" x2="382" y2="584" stroke="#6D4AFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#jev)"/>

    <rect x="500" y="620" width="380" height="72" rx="8" fill="#F1EDFF" stroke="#6D4AFF"/>
    <text x="516" y="643">Jev reads the progress so far:</text>
    <text x="516" y="663">stuck, or harder than it looked?</text>
    <text x="516" y="683">→ switch to a stronger model, once</text>
    <line x1="500" y1="652" x2="382" y2="652" stroke="#6D4AFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#jev)"/>
  </g>

  <!-- Roadmap Jev hooks -->
  <g font-size="13.5" fill="#4A3F6B">
    <rect x="500" y="346" width="380" height="34" rx="8" fill="#FBFAFF" stroke="#A08BFF" stroke-dasharray="5 3"/>
    <text x="516" y="368">Jev flags a better-fitting skill</text>
    <line x1="500" y1="363" x2="362" y2="363" stroke="#A08BFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#plan)"/>

    <rect x="500" y="388" width="380" height="76" rx="8" fill="#FBFAFF" stroke="#A08BFF" stroke-dasharray="5 3"/>
    <text x="516" y="411">Permission gate: Jev auto-approves safe</text>
    <text x="516" y="431">commands and tool calls, and asks the user</text>
    <text x="516" y="451">about risky ones</text>
    <line x1="500" y1="405" x2="362" y2="405" stroke="#A08BFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#plan)"/>
    <line x1="500" y1="447" x2="362" y2="447" stroke="#A08BFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#plan)"/>

    <rect x="500" y="700" width="380" height="54" rx="8" fill="#FBFAFF" stroke="#A08BFF" stroke-dasharray="5 3"/>
    <text x="516" y="723">Or Jev adds a hint to change approach,</text>
    <text x="516" y="743">keeping the model and its prompt cache</text>
    <path d="M500,727 H440 V670 H382" fill="none" stroke="#A08BFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#plan)"/>

    <rect x="500" y="762" width="380" height="54" rx="8" fill="#FBFAFF" stroke="#A08BFF" stroke-dasharray="5 3"/>
    <text x="516" y="785">Context near its limit: Jev picks old tool</text>
    <text x="516" y="805">results to drop, still readable later</text>
    <line x1="500" y1="789" x2="382" y2="789" stroke="#A08BFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#plan)"/>

    <rect x="500" y="836" width="380" height="54" rx="8" fill="#FBFAFF" stroke="#A08BFF" stroke-dasharray="5 3"/>
    <text x="516" y="859">Completion check: is every part of the</text>
    <text x="516" y="879">request answered? If not, keep working</text>
    <line x1="500" y1="864" x2="382" y2="864" stroke="#A08BFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#plan)"/>

    <rect x="500" y="950" width="380" height="54" rx="8" fill="#FBFAFF" stroke="#A08BFF" stroke-dasharray="5 3"/>
    <text x="516" y="973">Evaluation: Jev grades the answer claim</text>
    <text x="516" y="993">by claim, as the benchmark judge</text>
    <line x1="500" y1="978" x2="382" y2="978" stroke="#A08BFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#plan)"/>
  </g>
</svg>
